<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Dashboard</title>
    <style>
        /*  CSS VARIABLES */
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f3f4f6; /* slightly darker gray for list background */
            --border-color: #e5e7eb;
            --text-primary: #111827;
            --text-secondary: #6b7280;
            --text-muted: #9ca3af;
            --accent-blue: #2563eb;
            --accent-blue-bg: #eff6ff;
            --header-height: 70px;
        }

        /*  RESET & BASE  */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-primary);
            background: var(--bg-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            font-size: 14px;
        }

        /*  HEADER  */
        .header {
            height: var(--header-height);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between; /* Spaced out */
            padding: 0 1.5rem;
            background: var(--bg-primary);
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo-container {
            height: 40px;
            width: auto;
        }

        .logo-container img {
            height: 100%;
            width: auto;
            object-fit: contain;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        /* BUTTONS */
        button {
            cursor: pointer;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.85rem;
            padding: 0.5rem 1rem;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }

        .btn-refresh {
            background: #f3f4f6;
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-auto-main {
            background: var(--accent-blue);
            color: white;
        }

        /*  MAIN LAYOUT  */
        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* LEFT SIDEBAR (LIST) - 30% Width or Fixed 350px */
        .sidebar-left {
            width: 350px;
            flex-shrink: 0;
            border-right: 1px solid var(--border-color);
            background: var(--bg-primary);
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 1rem;
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 0.8rem;
            text-transform: uppercase;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
        }

        .email-list {
            overflow-y: auto;
            flex: 1;
        }

        .email-item {
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: background-color 0.1s;
        }

        .email-item:hover {
            background-color: var(--bg-secondary);
        }

        .email-item.selected {
            background-color: var(--accent-blue-bg);
            border-left: 3px solid var(--accent-blue);
            padding-left: calc(1rem - 3px); /* Compensate for border */
        }

        .email-header-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.25rem;
            font-size: 0.85rem;
        }

        .sender-name {
            font-weight: 700;
            color: var(--text-primary);
        }

        .email-time {
            color: var(--text-muted);
            font-size: 0.75rem;
        }

        .email-subject {
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 0.9rem;
        }

        .email-item.selected .sender-name { color: var(--accent-blue); }

        /*  RIGHT SIDE (DETAIL) - Fills remaining space */
        .detail-view {
            flex: 1;
            background: var(--bg-primary);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 0; /* Prevents flexbox overflow issues */
        }

        .detail-view.hidden { display: none; }

        .detail-header {
            border-bottom: 1px solid var(--border-color);
            padding: 1.5rem 2rem;
            background: #fff;
        }

        .detail-subject {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 1rem;
            line-height: 1.3;
        }

        .detail-info-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: var(--text-secondary);
        }

        .sender-detail { font-size: 1rem; color: var(--text-primary); }
        .sender-detail strong { font-weight: 600; }
        
        .meta-tags {
            display: flex;
            gap: 1rem;
            font-size: 0.85rem;
        }

        .tag {
            background: var(--bg-secondary);
            padding: 2px 8px;
            border-radius: 4px;
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }

        .detail-body {
            padding: 2rem;
            overflow-y: auto;
            flex: 1;
            line-height: 1.6;
            max-width: 900px; /* Readability limit */
        }
        
        /* Images in email body should stay within bounds */
        .detail-body img { max-width: 100%; height: auto; }
        
        /* Links */
        .detail-body a { color: var(--accent-blue); text-decoration: underline; }

        /*  EMPTY STATE */
        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            background: var(--bg-secondary);
        }
        .empty-icon { font-size: 3rem; margin-bottom: 1rem; opacity: 0.3; }

        /* UTILITIES */
        .hidden { display: none !important; }
        .loading { color: var(--text-muted); padding: 1rem; text-align: center; }
        .error { color: #dc2626; padding: 1rem; }

        /* Scrollbars */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #9ca3af; }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header class="header">
        <div class="header-left">
            <div class="logo-container">
                <img src="./Test.png" alt="Logo">
            </div>
            <h3 style="color: var(--text-secondary); font-weight: 400;">Inbox</h3>
        </div>

        <div class="header-actions">
            <button id="btn-refresh" class="btn-refresh" onclick="fetchEmails()">
                Refresh
            </button>
            <!-- AUTO Button, 2026. 03. 05 -->
            <button id="btn-auto-trigger" class="btn-auto-main" onclick="openAutoWindow()">
                AUTO Process
            </button>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <div class="main-container">
        
        <!-- LEFT: Email List -->
        <aside class="sidebar-left">
            <div class="sidebar-header">
                <span>All Messages</span>
                <span id="email-count">0</span>
            </div>
            <div id="email-list" class="email-list">
                <!-- Javascript injects items here -->
                <div class="loading">Loading...</div>
            </div>
        </aside>

        <!-- RIGHT: Detail View -->
        <main id="detail-view" class="detail-view hidden">
            <div class="detail-header">
                <h1 id="detail-subject" class="detail-subject">Subject Line</h1>
                
                <div class="detail-info-row">
                    <div class="sender-detail">
                        <span id="detail-sender">Sender Name</span>
                    </div>
                    
                    <div class="meta-tags">
                        <span class="tag" id="detail-time">Time</span>
                        <!-- Moved Deal ID here since we removed sidebar -->
                        <span class="tag" id="meta-deal">Deal ID</span>
                        <span class="tag" style="font-family: monospace;" id="detail-path">Path</span>
                    </div>
                </div>
            </div>

            <div id="detail-body" class="detail-body">
                <!-- Email HTML content injected here -->
            </div>
        </main>

        <!-- EMPTY STATE (Shown when nothing selected) -->
        <div id="empty-state" class="empty-state">
            <div class="empty-icon">✉️</div>
            <p>Select an email to view details</p>
        </div>

    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // CONFIGURATION
        const API_BASE = "http://127.0.0.1:8000/api";

        // --- BACKEND LOGIC PRESERVED --- 

        // 1. DYNAMIC AUTO FILL (Popup Logic)
        window.fillAutoData = async function() {
            // (Logic kept inside openAutoWindow injected script)
        };

        // State
        let emailsData = [];
        const htmlCache = new Map();

        // Template keys matching input.docx
        const templateKeys = ['Gutacthen', 'NAME', 'DATE', 'LAW_FIRM'];

        // Initialization
        document.addEventListener('DOMContentLoaded', () => {
            console.log("🚀 App Initializing...");
            setupEventListeners();
            fetchEmails();
        });

        // 0. Event Listeners
        function setupEventListeners() {
            const listContainer = document.getElementById('email-list');

            listContainer.addEventListener('click', (e) => {
                const item = e.target.closest('.email-item');
                if (item && item.dataset.index) {
                    const index = parseInt(item.dataset.index, 10);
                    selectEmail(index);
                }
            });

            listContainer.addEventListener('dblclick', (e) => {
                const item = e.target.closest('.email-item');
                if (item && item.dataset.index) {
                    const index = parseInt(item.dataset.index, 10);
                    openEmailInNewWindow(emailsData[index]);
                }
            });
        }

        // 1. FETCH EMAIL LIST
        async function fetchEmails() {
            const btn = document.getElementById('btn-refresh');
            const originalText = btn.textContent;
            btn.textContent = '...';
            btn.disabled = true;

            try {
                const res = await fetch(`${API_BASE}/emails`, { cache: 'no-store' });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                
                const rawData = await res.json();
                
                // Sort by time descending
                emailsData = rawData.sort((a, b) => new Date(b.sent_time) - new Date(a.sent_time));
                
                document.getElementById('email-count').textContent = emailsData.length;
                renderList();

            } catch (error) {
                console.error("❌ Error fetching emails:", error);
                document.getElementById('email-list').innerHTML = 
                    `<div class="error">Connection Failed: ${error.message}</div>`;
            } finally {
                btn.textContent = originalText;
                btn.disabled = false;
            }
        }

        // 2. FETCH HTML CONTENT
        async function fetchHtmlContent(path) {
            if (htmlCache.has(path)) return htmlCache.get(path);

            try {
                const res = await fetch(`${API_BASE}/html-content?path=${encodeURIComponent(path)}`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                const content = data.content || "No content found";
                htmlCache.set(path, content);
                return content;
            } catch (error) {
                return `<div class="error">Error loading file content: ${error.message}</div>`;
            }
        }

        // 3. RENDER LIST (MODIFIED: Removed Status Logic)
        function renderList() {
            const listContainer = document.getElementById('email-list');
            listContainer.innerHTML = '';
            
            if (emailsData.length === 0) {
                listContainer.innerHTML = '<div style="padding:1rem; text-align:center; color:#999">No emails found.</div>';
                return;
            }

            const fragment = document.createDocumentFragment();

            emailsData.forEach((email, index) => {
                const item = document.createElement('div');
                item.className = 'email-item'; // Removed 'status-taken' check
                item.dataset.index = index; 
                
                const senderName = (email.sender || "Unknown").split('<')[0].replace(/"/g, '').trim();

                // Clean layout: Name and Time on top, Subject below
                item.innerHTML = `
                    <div class="email-header-row">
                        <span class="sender-name">${escapeHtml(senderName)}</span>
                        <span class="email-time">${formatTime(email.sent_time)}</span>
                    </div>
                    <div class="email-subject">
                        ${escapeHtml(email.subject)}
                    </div>
                `;
                fragment.appendChild(item);
            });

            listContainer.appendChild(fragment);
        }

        // 4. HANDLE SELECTION (MODIFIED: Removed Metadata Sidebar logic)
        async function selectEmail(index) {
            const email = emailsData[index];
            if(!email) return;

            // Highlight in list
            document.querySelectorAll('.email-item').forEach(el => el.classList.remove('selected'));
            const selectedItem = document.querySelector(`.email-item[data-index="${index}"]`);
            if (selectedItem) selectedItem.classList.add('selected');

            // Show Detail View, Hide Empty State
            document.getElementById('empty-state').classList.add('hidden');
            document.getElementById('detail-view').classList.remove('hidden');

            // Fill Header Info
            document.getElementById('detail-subject').textContent = email.subject;
            document.getElementById('detail-sender').textContent = email.sender;
            document.getElementById('detail-time').textContent = new Date(email.sent_time).toLocaleString();
            document.getElementById('detail-path').textContent = `File: ${email.html_path}`;
            
            // Fill Deal ID (Moved from sidebar to header)
            document.getElementById('meta-deal').textContent = email.deal_number ? `Deal: ${email.deal_number}` : 'No Deal ID';

            // Load Body
            const bodyContainer = document.getElementById('detail-body');
            bodyContainer.innerHTML = '<div class="loading">Loading content...</div>';
            
            const htmlContent = await fetchHtmlContent(email.html_path);
            bodyContainer.innerHTML = htmlContent;
        }

        // 5. OPEN POPUP WINDOW (Unchanged logic)
        async function openEmailInNewWindow(email) {
            const newWindow = window.open("", "_blank", "width=900,height=800,scrollbars=yes,resizable=yes");
            if (!newWindow) { alert("Please allow popups"); return; }
            
            // Re-use current styles
            const currentStyle = document.querySelector('style').innerHTML;
            
            const html = `
                <!DOCTYPE html>
                <html lang="en">
                <head>
                    <title>${escapeHtml(email.subject)}</title>
                    <style>
                        ${currentStyle}
                        body { overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
                        .popup-content { padding: 2rem; overflow-y: auto; flex: 1; }
                    </style>
                </head>
                <body>
                    <div class="detail-header">
                        <h2>${escapeHtml(email.subject)}</h2>
                        <div style="color:var(--text-secondary)">${escapeHtml(email.sender)}</div>
                    </div>
                    <div id="popup-body" class="popup-content">Loading...</div>
                </body>
                </html>
            `;
            
            newWindow.document.write(html);
            newWindow.document.close();

            const content = await fetchHtmlContent(email.html_path);
            newWindow.document.getElementById('popup-body').innerHTML = content;
        }

        // 6. AUTO WINDOW LOGIC (Unchanged Logic, purely copied)
        function openAutoWindow() {
            const autoWindow = window.open("", "_blank", "width=600,height=800,scrollbars=yes,resizable=yes");
            if (!autoWindow) { alert("Please allow popups"); return; }

            const currentStyle = document.querySelector('style').innerHTML;

            const html = `
            <!DOCTYPE html>
            <html lang="en">
            <head>
                <title>CSV to Word Auto</title>
                <style>
                    ${currentStyle}
                    body { margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column; background: var(--bg-secondary); }
                    .auto-header { padding: 1.5rem; background: #fff; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
                    .btn-auto-fill { background: #fff; border: 1px solid var(--text-primary); padding: 0.5rem 1.5rem; cursor: pointer; border-radius: 4px; }
                    .auto-content { flex: 1; padding: 2rem; overflow-y: auto; display: flex; flex-direction: column; gap: 1rem; }
                    .form-row { display: flex; align-items: center; background: #fff; border: 1px solid var(--border-color); padding: 0.5rem; border-radius: 4px; }
                    .form-label { width: 30%; padding-left: 0.5rem; font-weight: 600; color: var(--text-secondary); }
                    .form-input { width: 70%; border: none; padding: 0.5rem; outline: none; }
                    .auto-footer { padding: 1.5rem; border-top: 1px solid var(--border-color); background: #fff; display: flex; justify-content: flex-end; }
                    .btn-download { background: var(--text-primary); color: #fff; border: none; padding: 0.75rem 2rem; font-weight: 700; cursor: pointer; border-radius: 4px; }
                </style>
            </head>
            <body>
                <div class="auto-header">
                    <h3>CSV to Word</h3>
                    <button class="btn-auto-fill" onclick="window.fillAutoData()">AUTO (Fill)</button>
                </div>
                <div id="form-container" class="auto-content"></div>
                <div class="auto-footer">
                    <button class="btn-download" onclick="window.triggerDownload()">Download DOCX</button>
                </div>
                <script>
                    const API_BASE = "${API_BASE}";
                    
                    window.fillAutoData = async function() {
                        const container = document.getElementById('form-container');
                        const btn = document.querySelector('.btn-auto-fill');
                        btn.textContent = "Loading...";
                        try {
                            const response = await fetch(API_BASE + "/get-csv-data");
                            if(!response.ok) throw new Error("Failed to load CSV");
                            const realData = await response.json();
                            const inputs = container.querySelectorAll('input');
                            let count = 0;
                            inputs.forEach(input => {
                                if(realData[input.name] !== undefined) {
                                    input.value = realData[input.name];
                                    input.style.backgroundColor = '#dcfce7';
                                    count++;
                                }
                            });
                            btn.textContent = "Done (" + count + ")";
                        } catch (e) { alert(e.message); btn.textContent = "Error"; }
                    };

                    window.triggerDownload = async function() {
                        const inputs = document.querySelectorAll('input');
                        const payload = {};
                        inputs.forEach(i => payload[i.name] = i.value);
                        const btn = document.querySelector('.btn-download');
                        btn.textContent = "Generating...";
                        
                        try {
                            const response = await fetch(API_BASE + "/generate-docx", {
                                method: "POST",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify(payload)
                            });
                            if (!response.ok) throw new Error("Failed");
                            const blob = await response.blob();
                            const url = window.URL.createObjectURL(blob);
                            const a = document.createElement('a');
                            a.href = url;
                            a.download = "Output.docx";
                            document.body.appendChild(a);
                            a.click();
                        } catch (e) { alert(e.message); } 
                        finally { btn.textContent = "Download DOCX"; }
                    };
                <\/script>
            </body>
            </html>
            `;

            autoWindow.document.write(html);
            autoWindow.document.close();

            const formContainer = autoWindow.document.getElementById('form-container');
            if(formContainer) {
                templateKeys.forEach(key => {
                    const row = autoWindow.document.createElement('div');
                    row.className = 'form-row';
                    row.innerHTML = `<div class="form-label">${key}</div><input class="form-input" name="${key}" type="text">`;
                    formContainer.appendChild(row);
                });
            }
        }

        // Helpers
        function formatTime(iso) {
            try { return new Date(iso).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}); } 
            catch { return iso; }
        }
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
