<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple E-Commerce Catalog</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Ayden's Shop</h1>
    <div class="cart-container">
      <button id="cart-toggle" class="cart-button">
        🛒 Cart (<span id="cart-count">0</span>)
      </button>
    </div>
  </header>

  <main>
    <section id="products">
      <h2>Products</h2>
      <div class="product-grid">
        <div class="product">
          <img src="https://www.apple.com/v/airpods-max/j/images/overview/product-stories/anc/anc_airpod_max_lifestyle__duzobvqwpz42_large_2x.jpg" alt="Product 1">
          <h3>Wireless Headphones</h3>
          <p class="price">$99.99</p>
          <button class="add-to-cart-btn" data-id="1" data-name="Wireless Headphones" data-price="99.99">Add to Cart</button>
        </div>
        <div class="product">
          <img src="https://store.storeimages.cdn-apple.com/1/as-images.apple.com/is/s11-case-unselect-gallery-1-202509?wid=5120&hei=3280&fmt=p-jpg&qlt=80&.v=WldDSmZlQ1ladGVha0lMWUJJK2M4ZHlVRllKam5abHNZRGludXlMbytKNUs0VDVpelJQc3lnS0NUUk44L0hxRlBPMVJocHRGWWdEaGFBbE5iRklMb1V1bEhkTE9wTm5MUHB5UTNxanYrU1FLWlhDb1MwbzRvVW12NWFVYzREWFg" alt="Product 2">
          <h3>Smart Watch</h3>
          <p class="price">$199.99</p>
          <button class="add-to-cart-btn" data-id="2" data-name="Smart Watch" data-price="199.99">Add to Cart</button>
        </div>
        <div class="product">
          <img src="https://www.apple.com/v/homepod/p/images/overview/hero__ernd10zm1dsi_large_2x.jpg" alt="Product 3">
          <h3>Bluetooth Speaker</h3>
          <p class="price">$79.99</p>
          <button class="add-to-cart-btn" data-id="3" data-name="Bluetooth Speaker" data-price="79.99">Add to Cart</button>
        </div>
        <div class="product">
          <img src="https://store.storeimages.cdn-apple.com/1/as-images.apple.com/is/MGD74?wid=1144&hei=1144&fmt=jpeg&qlt=90&.v=NTJadGxVMTVIZzE3TUFTdkZDTWhCd2tuVHYzMERCZURia3c5SzJFOTlPZ3hwd2F1dWM5TE1maUVxSVV1anZjQXdYczhRdkV0elVtZUJkWHRSQU9iaHc" alt="Product 4">
          <h3>Phone Charger</h3>
          <p class="price">$29.99</p>
          <button class="add-to-cart-btn" data-id="4" data-name="Phone Charger" data-price="29.99">Add to Cart</button>
        </div>
      </div>
    </section>

    <!-- Cart Modal -->
    <div id="cart-modal" class="modal">
      <div class="modal-content">
        <span class="close">&times;</span>
        <h2>Your Cart</h2>
        <ul id="cart-items"></ul>
        <div class="cart-total">
          <strong>Total: $<span id="total-price">0.00</span></strong>
        </div>
        <div id="checkout-form" class="checkout-form">
          <h3>Checkout</h3>
          <form id="purchase-form">
            <div class="form-group">
              <label for="name">Full Name:</label>
              <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
              <label for="email">Email:</label>
              <input type="email" id="email" name="email" required>
            </div>
            <button type="submit">Complete Purchase</button>
          </form>
        </div>
        <div id="success-message" class="success-message hidden">
          <h3>Thank you for your purchase!</h3>
          <p>Your order has been placed successfully.</p>
        </div>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
